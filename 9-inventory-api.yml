openapi: 3.1.0
info:
  title: Inventory API
  version: 1.0.0
  summary: Search, read and create parts, stock items and locations.
  description: |
    Contract-first API for the Inventory module.

    Where data comes from
    - Search operations are answered from the search index. They are eventually consistent.
    - Reading one object by its identifier is answered from the database and is always current.
    - Every write goes to the database first. The search index follows within about 5 seconds.

    Field names follow the naming standard: lowerCamelCase here, the same words as the
    snake_case columns in the database (partNumber is part_number).

    Base access: every request is limited to the bases in the caller's token.
    The server adds this filter. A client cannot remove or widen it.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://inventory.example.com
    description: Production
  - url: https://inventory.test.example.com
    description: Test
tags:
  - name: Stock items
    description: Physical items on a shelf, with certificates, life data and movements.
  - name: Parts
    description: The company-wide part catalogue.
  - name: Locations
    description: Bins and shelves, with the rules for what may be stored there.
  - name: Operations
    description: Background work, such as batches of up to 500 items.
security:
  - oauth2: []
  - openId: []
paths:
  /v1/stock-items:
    get:
      tags: [Stock items]
      operationId: searchStockItems
      summary: Search stock items
      description: |
        Free-text and filtered search. Answered from the search index, so a stock item
        created a moment ago may not appear yet. See the Consistency-Token header
        and the freshness block in the response.
      security:
        - oauth2: [inventory.stock.read]
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: baseId
          in: query
          description: Limit to one base. Must be a base the caller may access.
          schema: { type: string }
        - name: partId
          in: query
          schema: { $ref: '#/components/schemas/PublicId' }
        - name: locationId
          in: query
          schema: { $ref: '#/components/schemas/PublicId' }
        - name: conditionCode
          in: query
          style: form
          explode: false
          description: One or more condition codes, comma separated.
          schema: { type: array, items: { type: string } }
        - name: ownershipCode
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: statusCode
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: isServiceable
          in: query
          schema: { type: boolean }
        - name: hasCertificate
          in: query
          schema: { type: boolean }
        - name: shelfLifeExpiresBefore
          in: query
          schema: { type: string, format: date }
        - name: quantityOnHandMin
          in: query
          schema: { type: number, minimum: 0 }
        - $ref: '#/components/parameters/Facets'
        - name: sort
          in: query
          description: |
            Comma separated fields, each optionally prefixed with - for descending.
            Allowed: relevance, partNumber, quantityOnHand, shelfLifeExpiresOn, receivedAt, updatedAt.
          schema: { type: string, default: relevance }
          examples:
            expiring: { value: shelfLifeExpiresOn }
            newest: { value: '-receivedAt' }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ConsistencyTokenHeader'
      responses:
        '200':
          description: A page of stock items, with optional facets.
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItemSearchResult' }
              examples:
                page:
                  summary: Serviceable items for a part, first page
                  value:
                    data:
                      - stockItemId: 0190e5c0-7a1b-7c3e-9a55-3f0f6d2e1a10
                        baseId: YYZ
                        partNumber: AB-1234/5
                        partDescription: Hydraulic pump seal kit
                        serialNumber: SN-000771
                        quantityOnHand: { value: 1, unitCode: EA }
                        conditionCode: SERVICEABLE
                        ownershipCode: OWNED
                        locationPath: YYZ/MAIN/A-01-03
                        shelfLifeExpiresOn: '2028-03-31'
                        hasCertificate: true
                    page:
                      nextCursor: eyJzIjpbIkFCMTIzNDUiLCIwMTkwZTVjMCJdfQ
                      hasMore: true
                      limit: 25
                    facets:
                      conditionCode:
                        - { value: SERVICEABLE, count: 412 }
                        - { value: UNSERVICEABLE, count: 38 }
                    freshness:
                      indexedThrough: '2026-10-28T14:03:11.250Z'
                      lagMilliseconds: 1800
                      includesConsistencyToken: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/SearchUnavailable' }
    post:
      tags: [Stock items]
      operationId: receiveStockItems
      summary: Receive stock (single or batch)
      description: |
        Send one stock item to receive it now (201). Send a batch of up to 500 to receive
        them as a background operation (202).

        Retries: an Idempotency-Key header is required. If the same key is sent again with
        the same body, the first result is returned and nothing is received twice. If the same
        key is sent with a different body, the answer is 422 with code IDEMPOTENCY_KEY_REUSED.
        Keys are remembered for 24 hours.

        Validation:
        - A serialised item has quantity 1 and a serial number that is not already in use for the part.
        - If the part requires a certificate, at least one certificate is needed.
        - If the part requires shelf life, shelfLifeExpiresOn is needed.
        - If the part requires a manufacture date, manufacturedOn is needed.
        - A serviceable item cannot go to an unserviceable location, and the reverse.
        - Quantity is greater than zero. Cost needs its currency.
      security:
        - oauth2: [inventory.stock.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ReceiveStockItem'
                - $ref: '#/components/schemas/ReceiveStockItemBatch'
            examples:
              serialisedComponent:
                summary: Serialised component with a certificate and life data
                value:
                  baseId: YYZ
                  partId: 0190e5a1-1c2d-7a44-8b10-9e3c4a5b6c70
                  locationId: 0190e5b3-6d10-7f21-a1c4-0b7e8d9f1a22
                  serialNumber: SN-000771
                  quantity: { value: 1, unitCode: EA }
                  conditionCode: SERVICEABLE
                  ownershipCode: OWNED
                  receivedAt: '2026-10-28T13:55:00Z'
                  manufacturedOn: '2024-02-15'
                  shelfLifeExpiresOn: '2028-03-31'
                  unitCostOrder: { amount: '1840.00', currencyCode: EUR }
                  unitCostBase: { amount: '2760.00', currencyCode: CAD }
                  certificates:
                    - type: EASA_FORM_1
                      number: 'F1-2024-558812'
                      issuedOn: '2024-02-20'
                      approvalRef: APP-77120
                  lifeData:
                    - code: AIRFRAME_HOURS
                      timeSinceNew: 1220.5
                      timeSinceOverhaul: 310.0
                      timeSinceInstall: 0
                      usage: HOURS
                  remarks: Received against order PO-88231.
      responses:
        '201':
          description: The stock item was received.
          headers:
            Location:
              description: URL of the new stock item.
              schema: { type: string, format: uri-reference }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Consistency-Token: { $ref: '#/components/headers/ConsistencyToken' }
            Idempotency-Replayed:
              description: "true when this is the saved answer to an earlier request with the same key."
              schema: { type: boolean }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItem' }
              examples:
                created:
                  summary: Result for the serialised component above
                  value:
                    stockItemId: 0190e5c0-7a1b-7c3e-9a55-3f0f6d2e1a10
                    baseId: YYZ
                    partId: 0190e5a1-1c2d-7a44-8b10-9e3c4a5b6c70
                    partNumber: AB-1234/5
                    partDescription: Hydraulic pump
                    locationId: 0190e5b3-6d10-7f21-a1c4-0b7e8d9f1a22
                    locationPath: YYZ/MAIN/A-01-03
                    serialNumber: SN-000771
                    quantityOnHand: { value: 1, unitCode: EA }
                    conditionCode: SERVICEABLE
                    ownershipCode: OWNED
                    statusCode: AVAILABLE
                    isAllocationBlocked: false
                    receivedAt: '2026-10-28T13:55:00Z'
                    manufacturedOn: '2024-02-15'
                    shelfLifeExpiresOn: '2028-03-31'
                    unitCostOrder: { amount: '1840.00', currencyCode: EUR }
                    unitCostBase: { amount: '2760.00', currencyCode: CAD }
                    hasCertificate: true
                    certificates:
                      - type: EASA_FORM_1
                        number: 'F1-2024-558812'
                        issuedOn: '2024-02-20'
                        approvalRef: APP-77120
                    lifeData:
                      - code: AIRFRAME_HOURS
                        timeSinceNew: 1220.5
                        timeSinceOverhaul: 310.0
                        timeSinceInstall: 0
                        usage: HOURS
                    createdAt: '2026-10-28T13:55:02.114Z'
                    rowVersion: 1
        '202':
          description: |
            The batch was accepted and is being processed. Poll the operation, or wait
            for the callback if one was registered.
          headers:
            Location:
              description: URL of the operation resource.
              schema: { type: string, format: uri-reference }
            Retry-After:
              description: Seconds to wait before checking the operation.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /v1/stock-items/{stockItemId}:
    parameters:
      - $ref: '#/components/parameters/StockItemId'
    get:
      tags: [Stock items]
      operationId: getStockItem
      summary: Get one stock item with certificates and life data
      description: Always answered from the database, so it is current.
      security:
        - oauth2: [inventory.stock.read]
      responses:
        '200':
          description: The stock item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              schema: { type: string, const: 'no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItem' }
        '304':
          description: Not modified since the ETag sent in If-None-Match.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Stock items]
      operationId: updateStockItem
      summary: Change allowed fields of a stock item
      description: |
        Uses JSON Merge Patch. Only the fields listed in the request schema can change here.
        Quantity, location, condition and ownership change through movements, not through this call.

        Concurrency: send the ETag from the last read in If-Match. If another user
        changed the item since, the answer is 412 and the client must read the item again.
        Without If-Match the answer is 428.
      security:
        - oauth2: [inventory.stock.write]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/StockItemPatch' }
            examples:
              block:
                summary: Block an item from allocation
                value:
                  isAllocationBlocked: true
                  remarks: "Held for inspection."
      responses:
        '200':
          description: The updated stock item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Consistency-Token: { $ref: '#/components/headers/ConsistencyToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/stock-items/{stockItemId}/movements:
    parameters:
      - $ref: '#/components/parameters/StockItemId'
    get:
      tags: [Stock items]
      operationId: listStockItemMovements
      summary: List the movements of a stock item
      description: Newest first. Always answered from the database, from the movement ledger.
      security:
        - oauth2: [inventory.stock.read]
      parameters:
        - name: movementTypeCode
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/MovementTypeCode' }
        - name: movedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: movedTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of movements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MovementPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/parts:
    get:
      tags: [Parts]
      operationId: searchParts
      summary: Search parts
      description: |
        Answered from the search index. A part number matches however it is typed:
        AB-1234/5, ab 1234 5 and ab12345 find the same part. Parts that list the searched
        number as an alternate are included and marked.
      security:
        - oauth2: [inventory.part.read]
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: statusCode
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: classificationCode
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: includeAlternates
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Facets'
        - name: sort
          in: query
          description: 'Allowed: relevance, partNumber, description, updatedAt. Prefix - for descending.'
          schema: { type: string, default: relevance }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ConsistencyTokenHeader'
      responses:
        '200':
          description: A page of parts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartSearchResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SearchUnavailable' }
    post:
      tags: [Parts]
      operationId: createPart
      summary: Create a part
      description: |
        Part numbers are unique after normalising: AB-1234/5 and AB12345 are the same part.
        A duplicate answers 409 with code PART_NUMBER_ALREADY_EXISTS.
      security:
        - oauth2: [inventory.part.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePart' }
      responses:
        '201':
          description: The part was created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Consistency-Token: { $ref: '#/components/headers/ConsistencyToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Part' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/parts/{partId}:
    parameters:
      - name: partId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/PublicId' }
    get:
      tags: [Parts]
      operationId: getPart
      summary: Get one part
      description: Always answered from the database, so it is current. Includes alternates.
      security:
        - oauth2: [inventory.part.read]
      responses:
        '200':
          description: The part.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Part' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/locations:
    get:
      tags: [Locations]
      operationId: searchLocations
      summary: Search locations
      description: Answered from the search index. Only locations at bases the caller may access.
      security:
        - oauth2: [inventory.location.read]
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: baseId
          in: query
          schema: { type: string }
        - name: isServiceable
          in: query
          schema: { type: boolean }
        - name: isQuarantine
          in: query
          schema: { type: boolean }
        - name: isActive
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Fields'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ConsistencyTokenHeader'
      responses:
        '200':
          description: A page of locations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationSearchResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SearchUnavailable' }
    post:
      tags: [Locations]
      operationId: createLocation
      summary: Create a location
      description: |
        A location cannot be both serviceable and unserviceable. The code is unique within
        its base, plant and warehouse.
      security:
        - oauth2: [inventory.location.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLocation' }
      responses:
        '201':
          description: The location was created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Consistency-Token: { $ref: '#/components/headers/ConsistencyToken' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /v1/operations/{operationId}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Check a background operation
      description: |
        Shows the state of an accepted batch. A finished operation lists the outcome of every
        item, in the order sent. Each item is received or rejected on its own, so a bad item
        never blocks the rest. Operations are kept for 7 days.
      security:
        - oauth2: [inventory.stock.write]
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PublicId' }
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 authorisation code with PKCE for the Angular app, client credentials for
        other modules. The token also carries a bases claim: the list of bases the user works at.
      flows:
        authorizationCode:
          authorizationUrl: https://login.example.com/oauth2/authorize
          tokenUrl: https://login.example.com/oauth2/token
          scopes:
            inventory.stock.read: Search and read stock items and movements
            inventory.stock.write: Receive and change stock items
            inventory.part.read: Search and read parts
            inventory.part.write: Create and change parts
            inventory.location.read: Search and read locations
            inventory.location.write: Create and change locations
        clientCredentials:
          tokenUrl: https://login.example.com/oauth2/token
          scopes:
            inventory.stock.read: Search and read stock items and movements
            inventory.stock.write: Receive and change stock items
    openId:
      type: openIdConnect
      openIdConnectUrl: https://login.example.com/.well-known/openid-configuration
  headers:
    ETag:
      description: Version of the object. Send it back in If-Match to change it.
      schema: { type: string }
    RequestId:
      description: Identifier to quote when reporting a problem.
      schema: { type: string }
    ConsistencyToken:
      description: |
        Marks the point this write reached in the change stream. Send it in the
        Consistency-Token header on a search to wait for the index to catch up.
      schema: { type: string }
  parameters:
    Query:
      name: q
      in: query
      description: Free text. Part numbers can be typed with or without dashes, spaces and capitals.
      schema: { type: string, maxLength: 200 }
    Facets:
      name: facets
      in: query
      style: form
      explode: false
      description: Fields to count, comma separated. Counts reflect the other active filters.
      schema:
        type: array
        items: { type: string }
        maxItems: 6
    Fields:
      name: fields
      in: query
      style: form
      explode: false
      description: |
        Return only these fields (sparse field selection). Identifiers are always returned.
        Unknown fields answer 400.
      schema:
        type: array
        items: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque value from the previous page. It works for any depth. Do not build or
        change it. Offsets are not offered because they fail beyond a few thousand rows.
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A new unique value (a UUID) for each intended action. Reuse it only to retry that action.
      schema: { type: string, minLength: 16, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last read.
      schema: { type: string }
    ConsistencyTokenHeader:
      name: Consistency-Token
      in: header
      description: |
        Token returned by a write. The search waits up to 2 seconds for the index to include
        that write. If it does not in time, results are returned and freshness.includesConsistencyToken is false.
      schema: { type: string }
    StockItemId:
      name: stockItemId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublicId' }
  responses:
    BadRequest:
      description: The request could not be understood.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            badField:
              value:
                type: https://inventory.example.com/problems/invalid-query
                title: The query is not valid.
                status: 400
                code: INVALID_QUERY
                detail: Field 'colour' cannot be used to sort.
                instance: /v1/stock-items
                requestId: 7f3c9e1a
                errors:
                  - { pointer: '#/sort', code: SORT_FIELD_NOT_ALLOWED, message: Field 'colour' cannot be used to sort. }
    Unauthorized:
      description: No valid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The token lacks the scope, or the base is not one the user works at.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: |
        Not found, or at a base the user cannot access. Both look the same, so the
        existence of other bases' data is not revealed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: The request conflicts with the current data, for example a duplicate serial number.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            serial:
              value:
                type: https://inventory.example.com/problems/serial-number-in-use
                title: The serial number is already in use.
                status: 409
                code: SERIAL_NUMBER_IN_USE
                detail: Serial SN-000771 already exists for this part.
                requestId: 7f3c9e1b
                errors:
                  - { pointer: '#/serialNumber', code: SERIAL_NUMBER_IN_USE, message: Already in use for this part. }
    ValidationFailed:
      description: The request is well formed but breaks a rule. Every broken rule is listed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            rules:
              value:
                type: https://inventory.example.com/problems/validation-failed
                title: The stock item cannot be received.
                status: 422
                code: VALIDATION_FAILED
                requestId: 7f3c9e1c
                errors:
                  - { pointer: '#/certificates', code: CERTIFICATE_REQUIRED, message: This part requires a certificate. }
                  - { pointer: '#/locationId', code: LOCATION_NOT_SERVICEABLE, message: A serviceable item cannot go to an unserviceable location. }
    PreconditionFailed:
      description: |
        Someone else changed the object after it was read. Read it again, check the changes
        against your own, then retry with the new ETag. The body shows the current version.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            stale:
              value:
                type: https://inventory.example.com/problems/version-conflict
                title: The stock item was changed by someone else.
                status: 412
                code: VERSION_CONFLICT
                detail: You sent version 3. The current version is 4.
                requestId: 7f3c9e1d
                currentRowVersion: 4
    PreconditionRequired:
      description: If-Match was not sent.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Too many requests. Wait for the time in Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SearchUnavailable:
      description: |
        The search index is not available. Reading one object by id and receiving stock
        still work. The response says so, and offers the alternatives.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    PublicId:
      type: string
      format: uuid
      description: External identifier of an object. The database numeric key is never exposed.
    Quantity:
      type: object
      description: A quantity always carries its unit.
      required: [value, unitCode]
      properties:
        value: { type: number, minimum: 0, multipleOf: 0.000001 }
        unitCode: { type: string, maxLength: 16, examples: [EA] }
      additionalProperties: false
    Money:
      type: object
      description: Money always carries its currency. The amount is a string so no precision is lost.
      required: [amount, currencyCode]
      properties:
        amount: { type: string, pattern: '^-?\d{1,12}(\.\d{1,6})?$', examples: ['1840.00'] }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', description: ISO 4217, examples: [CAD] }
      additionalProperties: false
    ConditionCode:
      type: string
      description: |
        Codes come from a maintained list. The values shown are examples.
        New codes can appear, so clients must not fail on unknown values.
      examples: [SERVICEABLE]
    MovementTypeCode:
      type: string
      enum:
        - RECEIVE
        - ISSUE
        - RETURN
        - TRANSFER_OUT
        - TRANSFER_IN
        - DESPATCH
        - WRITE_OFF
        - WRITE_ON
        - STOCK_CHECK_ADJUST
        - RECLASSIFY
        - OPENING_BALANCE
    CertificateTypeCode:
      type: string
      enum: [EASA_FORM_1, FAA_8130_3, CERTIFICATE_OF_CONFORMANCE, OTHER]
    Certificate:
      type: object
      required: [type, number]
      properties:
        type: { $ref: '#/components/schemas/CertificateTypeCode' }
        number: { type: string, maxLength: 64 }
        issuedOn: { type: string, format: date }
        approvalRef:
          type: string
          maxLength: 64
          description: Reference to the approval in the technical records module.
      additionalProperties: false
    LifeEntry:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 32, description: 'The life code, for example hours or cycles.' }
        timeSinceNew: { type: number, minimum: 0 }
        timeSinceOverhaul: { type: number, minimum: 0 }
        timeSinceInstall: { type: number, minimum: 0 }
        usage: { type: string, maxLength: 32 }
        isOk: { type: boolean }
      additionalProperties: false
    ReceiveStockItem:
      type: object
      required: [baseId, partId, locationId, quantity, conditionCode, ownershipCode, receivedAt]
      properties:
        baseId: { type: string, maxLength: 16 }
        partId: { $ref: '#/components/schemas/PublicId' }
        locationId: { $ref: '#/components/schemas/PublicId' }
        serialNumber: { type: string, maxLength: 64 }
        batchNumber: { type: string, maxLength: 64 }
        barcode: { type: string, maxLength: 64 }
        quantity: { $ref: '#/components/schemas/Quantity' }
        conditionCode: { $ref: '#/components/schemas/ConditionCode' }
        ownershipCode: { type: string, maxLength: 32 }
        categoryCode: { type: string, maxLength: 32 }
        receivedAt: { type: string, format: date-time }
        manufacturedOn: { type: string, format: date }
        shelfLifeExpiresOn: { type: string, format: date }
        unitCostOrder: { $ref: '#/components/schemas/Money' }
        unitCostBase: { $ref: '#/components/schemas/Money' }
        isFreeOfCharge: { type: boolean, default: false }
        certificates:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Certificate' }
        lifeData:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/LifeEntry' }
        warranty:
          type: object
          properties:
            isWarranty: { type: boolean }
            remarks: { type: string, maxLength: 500 }
        sourceRef:
          type: string
          maxLength: 64
          description: Order or receipt reference from the orders module.
        remarks: { type: string, maxLength: 1000 }
      additionalProperties: false
    ReceiveStockItemBatch:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 2
          maxItems: 500
          items: { $ref: '#/components/schemas/ReceiveStockItem' }
        callbackUrl:
          type: string
          format: uri
          description: Optional. Called once with the finished operation. Polling always works too.
      additionalProperties: false
    StockItem:
      type: object
      required: [stockItemId, baseId, partId, partNumber, locationId, quantityOnHand, conditionCode, ownershipCode, statusCode, rowVersion]
      properties:
        stockItemId: { $ref: '#/components/schemas/PublicId' }
        baseId: { type: string }
        partId: { $ref: '#/components/schemas/PublicId' }
        partNumber: { type: string }
        partDescription: { type: string }
        locationId: { $ref: '#/components/schemas/PublicId' }
        locationPath: { type: string }
        previousLocationId:
          oneOf:
            - { $ref: '#/components/schemas/PublicId' }
            - { type: 'null' }
        serialNumber: { type: [string, 'null'] }
        batchNumber: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        quantityOnHand: { $ref: '#/components/schemas/Quantity' }
        conditionCode: { $ref: '#/components/schemas/ConditionCode' }
        ownershipCode: { type: string }
        statusCode: { type: string }
        categoryCode: { type: [string, 'null'] }
        isAllocationBlocked: { type: boolean }
        receivedAt: { type: string, format: date-time }
        receivedQuantity: { $ref: '#/components/schemas/Quantity' }
        manufacturedOn: { type: [string, 'null'], format: date }
        shelfLifeExpiresOn: { type: [string, 'null'], format: date }
        unitCostOrder: { $ref: '#/components/schemas/Money' }
        unitCostBase: { $ref: '#/components/schemas/Money' }
        isFreeOfCharge: { type: boolean }
        hasCertificate: { type: boolean }
        certificates:
          type: array
          items: { $ref: '#/components/schemas/Certificate' }
        lifeData:
          type: array
          items: { $ref: '#/components/schemas/LifeEntry' }
        isLifeUnknown: { type: boolean }
        remarks: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        rowVersion: { type: integer, description: Same value as in the ETag. }
    StockItemPatch:
      type: object
      description: The only fields that can be changed directly.
      properties:
        isAllocationBlocked: { type: boolean }
        remarks: { type: [string, 'null'], maxLength: 1000 }
        barcode: { type: [string, 'null'], maxLength: 64 }
      additionalProperties: false
      minProperties: 1
    StockItemSummary:
      type: object
      description: The fields in a search result. The fields parameter can select fewer.
      required: [stockItemId]
      properties:
        stockItemId: { $ref: '#/components/schemas/PublicId' }
        baseId: { type: string }
        partId: { $ref: '#/components/schemas/PublicId' }
        partNumber: { type: string }
        partDescription: { type: string }
        serialNumber: { type: [string, 'null'] }
        batchNumber: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        quantityOnHand: { $ref: '#/components/schemas/Quantity' }
        conditionCode: { type: string }
        ownershipCode: { type: string }
        statusCode: { type: string }
        isServiceable: { type: boolean }
        locationId: { $ref: '#/components/schemas/PublicId' }
        locationPath: { type: string }
        shelfLifeExpiresOn: { type: [string, 'null'], format: date }
        hasCertificate: { type: boolean }
        receivedAt: { type: string, format: date-time }
        matchedAsAlternateOf:
          type: [string, 'null']
          description: Set when the item matched through an alternate part number.
    Page:
      type: object
      required: [limit, hasMore]
      properties:
        limit: { type: integer }
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }
    Facets:
      type: object
      description: One entry per requested facet field.
      additionalProperties:
        type: array
        items: { $ref: '#/components/schemas/FacetValue' }
    Freshness:
      type: object
      description: |
        How current this search answer is. Clients show a notice when lagMilliseconds is high,
        and use Get by id when they need a current answer.
      required: [indexedThrough, lagMilliseconds]
      properties:
        indexedThrough:
          type: string
          format: date-time
          description: Every change committed before this time is in the results.
        lagMilliseconds: { type: integer, minimum: 0 }
        includesConsistencyToken:
          type: [boolean, 'null']
          description: |
            When the request had a Consistency-Token, true if the results include that write,
            false if the wait timed out.
    StockItemSearchResult:
      type: object
      required: [data, page, freshness]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/StockItemSummary' }
        page: { $ref: '#/components/schemas/Page' }
        facets: { $ref: '#/components/schemas/Facets' }
        freshness: { $ref: '#/components/schemas/Freshness' }
    MovementPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Movement' }
        page: { $ref: '#/components/schemas/Page' }
    Movement:
      type: object
      required: [movementId, movementAt, movementTypeCode, quantity]
      properties:
        movementId: { $ref: '#/components/schemas/PublicId' }
        movementAt: { type: string, format: date-time }
        movementTypeCode: { $ref: '#/components/schemas/MovementTypeCode' }
        quantity: { $ref: '#/components/schemas/Quantity' }
        fromLocationId: { type: [string, 'null'], format: uuid }
        toLocationId: { type: [string, 'null'], format: uuid }
        fromConditionCode: { type: [string, 'null'] }
        toConditionCode: { type: [string, 'null'] }
        fromOwnershipCode: { type: [string, 'null'] }
        toOwnershipCode: { type: [string, 'null'] }
        unitCostBase: { $ref: '#/components/schemas/Money' }
        reasonCode: { type: [string, 'null'] }
        sourceType: { type: [string, 'null'] }
        referenceNo: { type: [string, 'null'] }
        reversesMovementId: { type: [string, 'null'], format: uuid }
        actorUserId: { type: string }
        origin:
          type: string
          enum: [LIVE, OPENING, MIGRATED]
        remarks: { type: [string, 'null'] }
    CreatePart:
      type: object
      required: [partNumber, description, classificationCode, unitCode]
      properties:
        partNumber: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        shortDescription: { type: string, maxLength: 128 }
        commonName: { type: string, maxLength: 128 }
        classificationCode: { type: string, maxLength: 32 }
        unitCode: { type: string, maxLength: 16 }
        unitQty: { type: number, exclusiveMinimum: 0, default: 1 }
        shelfLifeMonths: { type: integer, minimum: 1 }
        startsShelfLifeOnFirstUse: { type: boolean, default: false }
        oemPartNumber: { type: string, maxLength: 64 }
        manufacturerName: { type: string, maxLength: 128 }
        modelNumber: { type: string, maxLength: 64 }
        isExportControlled: { type: boolean, default: false }
        eccnCode: { type: string, maxLength: 32 }
        unNumber: { type: string, maxLength: 32 }
        isSensitive: { type: boolean, default: false }
        lengthMm: { type: number, minimum: 0 }
        widthMm: { type: number, minimum: 0 }
        heightMm: { type: number, minimum: 0 }
        weightKg: { type: number, minimum: 0 }
        lifeRules: { type: object, additionalProperties: true }
        exportRules: { type: object, additionalProperties: true }
        alternates:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/PartAlternativeInput' }
      additionalProperties: false
    PartAlternativeInput:
      type: object
      required: [alternativePartId]
      properties:
        alternativePartId: { $ref: '#/components/schemas/PublicId' }
        isTwoWay: { type: boolean, default: false }
        authority: { type: string, maxLength: 64 }
        qaNumber: { type: string, maxLength: 64 }
        approvalRef: { type: string, maxLength: 64 }
    Part:
      type: object
      required: [partId, partNumber, description, statusCode, classificationCode, unitCode, rowVersion]
      properties:
        partId: { $ref: '#/components/schemas/PublicId' }
        partNumber: { type: string }
        partNumberKey:
          type: string
          description: The part number reduced to letters and digits in capitals. Used for matching.
        description: { type: string }
        shortDescription: { type: [string, 'null'] }
        commonName: { type: [string, 'null'] }
        classificationCode: { type: string }
        statusCode: { type: string }
        isActive: { type: boolean }
        unitCode: { type: string }
        unitLongName: { type: [string, 'null'] }
        unitQty: { type: number }
        requiresShelfLife: { type: boolean }
        requiresCertificate: { type: boolean }
        requiresManufactureDate: { type: boolean }
        shelfLifeMonths: { type: [integer, 'null'] }
        startsShelfLifeOnFirstUse: { type: boolean }
        oemPartNumber: { type: [string, 'null'] }
        manufacturerName: { type: [string, 'null'] }
        modelNumber: { type: [string, 'null'] }
        isExportControlled: { type: boolean }
        eccnCode: { type: [string, 'null'] }
        unNumber: { type: [string, 'null'] }
        isSensitive: { type: boolean }
        lengthMm: { type: [number, 'null'] }
        widthMm: { type: [number, 'null'] }
        heightMm: { type: [number, 'null'] }
        weightKg: { type: [number, 'null'] }
        lifeRules: { type: [object, 'null'], additionalProperties: true }
        exportRules: { type: [object, 'null'], additionalProperties: true }
        alternates:
          type: array
          items: { $ref: '#/components/schemas/PartAlternativeInput' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: [string, 'null'], format: date-time }
        rowVersion: { type: integer }
    PartSummary:
      type: object
      required: [partId]
      properties:
        partId: { $ref: '#/components/schemas/PublicId' }
        partNumber: { type: string }
        description: { type: string }
        classificationCode: { type: string }
        statusCode: { type: string }
        unitCode: { type: string }
        manufacturerName: { type: [string, 'null'] }
        matchedAsAlternateOf:
          type: [string, 'null']
          description: Set when the part matched because it is an alternate of the searched number.
    PartSearchResult:
      type: object
      required: [data, page, freshness]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PartSummary' }
        page: { $ref: '#/components/schemas/Page' }
        facets: { $ref: '#/components/schemas/Facets' }
        freshness: { $ref: '#/components/schemas/Freshness' }
    CreateLocation:
      type: object
      required: [baseId, plantCode, warehouseCode, locationCode]
      properties:
        baseId: { type: string, maxLength: 16 }
        plantCode: { type: string, maxLength: 32 }
        warehouseCode: { type: string, maxLength: 32 }
        warehouseName: { type: string, maxLength: 128 }
        locationCode: { type: string, maxLength: 64 }
        description: { type: string, maxLength: 255 }
        barcode: { type: string, maxLength: 64 }
        locationCategoryCode: { type: string, maxLength: 32 }
        isServiceable: { type: boolean, default: false }
        isUnserviceable: { type: boolean, default: false }
        allowsPutAway: { type: boolean, default: true }
        allowsAllocation: { type: boolean, default: true }
        isAllocationBlocked: { type: boolean, default: false }
        isLineStore: { type: boolean, default: false }
        isQuarantine: { type: boolean, default: false }
        remarks: { type: string, maxLength: 512 }
      additionalProperties: false
    Location:
      type: object
      required: [locationId, baseId, locationCode, locationPath, rowVersion]
      properties:
        locationId: { $ref: '#/components/schemas/PublicId' }
        baseId: { type: string }
        plantCode: { type: string }
        warehouseCode: { type: string }
        warehouseName: { type: [string, 'null'] }
        locationCode: { type: string }
        locationPath: { type: string }
        description: { type: [string, 'null'] }
        barcode: { type: [string, 'null'] }
        locationCategoryCode: { type: [string, 'null'] }
        isServiceable: { type: boolean }
        isUnserviceable: { type: boolean }
        allowsPutAway: { type: boolean }
        allowsAllocation: { type: boolean }
        isAllocationBlocked: { type: boolean }
        isLineStore: { type: boolean }
        isQuarantine: { type: boolean }
        isUnderQuery: { type: boolean }
        isActive: { type: boolean }
        remarks: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        rowVersion: { type: integer }
    LocationSearchResult:
      type: object
      required: [data, page, freshness]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Location' }
        page: { $ref: '#/components/schemas/Page' }
        freshness: { $ref: '#/components/schemas/Freshness' }
    Operation:
      type: object
      required: [operationId, state, total]
      properties:
        operationId: { $ref: '#/components/schemas/PublicId' }
        state:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, PARTIALLY_SUCCEEDED, FAILED]
        total: { type: integer, minimum: 1, maximum: 500 }
        succeeded: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        results:
          type: array
          description: One entry per item, in the order sent. Present when finished.
          items: { $ref: '#/components/schemas/OperationItemResult' }
    OperationItemResult:
      type: object
      required: [index, status]
      properties:
        index: { type: integer, minimum: 0 }
        status: { type: string, enum: [CREATED, REJECTED] }
        stockItemId:
          type: [string, 'null']
          format: uuid
        problem:
          oneOf:
            - { $ref: '#/components/schemas/Problem' }
            - { type: 'null' }
    ErrorCode:
      type: string
      description: |
        Stable code. Codes are never renamed or reused. New ones can be added, so clients
        must treat unknown codes as a general error of the same status.
      enum:
        - INVALID_QUERY
        - SORT_FIELD_NOT_ALLOWED
        - FIELD_NOT_ALLOWED
        - VALIDATION_FAILED
        - REQUIRED_FIELD_MISSING
        - QUANTITY_MUST_BE_POSITIVE
        - SERIAL_QUANTITY_MUST_BE_ONE
        - SERIAL_NUMBER_IN_USE
        - CERTIFICATE_REQUIRED
        - SHELF_LIFE_REQUIRED
        - MANUFACTURE_DATE_REQUIRED
        - LOCATION_NOT_SERVICEABLE
        - LOCATION_NOT_UNSERVICEABLE
        - LOCATION_INACTIVE
        - COST_CURRENCY_MISSING
        - PART_NOT_FOUND
        - PART_INACTIVE
        - PART_NUMBER_ALREADY_EXISTS
        - LOCATION_CODE_ALREADY_EXISTS
        - BASE_NOT_ALLOWED
        - SCOPE_MISSING
        - NOT_FOUND
        - VERSION_CONFLICT
        - PRECONDITION_REQUIRED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_REQUEST_IN_PROGRESS
        - BATCH_TOO_LARGE
        - RATE_LIMITED
        - SEARCH_UNAVAILABLE
        - INTERNAL_ERROR
    FieldError:
      type: object
      required: [pointer, code, message]
      properties:
        pointer:
          type: string
          description: JSON Pointer to the field in the request, for example #/certificates/0/number.
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
    Problem:
      type: object
      description: Problem details as in RFC 9457, with a stable code and field errors.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        requestId: { type: string }
        currentRowVersion:
          type: integer
          description: Only on VERSION_CONFLICT.
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }